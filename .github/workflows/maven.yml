name: Java CI

on:
  push:
    branches: [ '*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 8 for toolchain
      id: setup-java8
      uses: actions/setup-java@v5
      with:
        java-version: 8
        distribution: 'zulu'
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'zulu'
        cache: 'maven'
    - name: Build with Maven
      run: export JAVA8_HOME=${{ steps.setup-java8.outputs.path }} && mvn -B verify -Dgpg.skip=true --global-toolchains .github/workflows/toolchains.xml -Pgithub-workflow
  deploy:
    if: ${{ github.ref == 'refs/heads/version2' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'
          server-id: sonatype-snapshots
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Deploy with Maven
        run: mvn clean deploy -B -DskipTests -DskipPitest -Dinvoker.skip=true -Dgpg.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_SNAPS_USER }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_SNAPS_PASS }}
